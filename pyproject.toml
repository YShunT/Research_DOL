[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dol-research"
version = "0.1.0"
description = "Research code for DOL^^."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<2",
    "pandas>=2,<3",
    "torch==2.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dol"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]
